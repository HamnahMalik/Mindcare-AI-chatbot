<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindCare Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 420px;
      max-width: 95%;
      height: 680px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    .header h2 {
      margin: 0;
    }

    .header p {
      margin: 6px 0 0;
      color: #666;
      font-size: 13px;
    }

    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    .message {
      max-width: 82%;
      padding: 10px 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .bot {
      background: #f0f0f0;
      margin-right: auto;
    }

    .user {
      background: #dfefff;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 9px;
      outline: none;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .typing {
      font-size: 12px;
      color: #777;
      margin: 0 16px 8px;
      display: none;
    }
.demo-badge {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 9px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 999px;
  background: #fff3cd;
  color: #7a5a00;
  border: 1px solid #ffe69c;
}

.header p {
  margin: 8px 0 0;
  color: #666;
  font-size: 13px;
}
  </style>
</head>

<body>

<div class="chat-container">

 
  <div class="header">
    <h2>MindCare</h2>
    <div class="demo-badge">
    Demo Prototype — For testing purposes only
  </div>

  <p>Clinic Information & Appointment Assistant</p>
</div>

  <div id="messages">
    <div class="message bot">
       Hello! I'm the MindCare demo assistant.
 

       This prototype is for demonstration and testing purposes only and does not provide medical diagnosis or treatment advice.
    </div>
 </div>

  <div id="typing" class="typing">
    MindCare is typing...
  </div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Type your message..."
      autocomplete="off"
    >

    <button id="sendButton" type="button">
      Send
    </button>
  </div>

</div>

<script>
  let userId = localStorage.getItem("mindcare_user_id");

  if (!userId) {
    userId =
      "web-" +
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2, 10);

    localStorage.setItem("mindcare_user_id", userId);
  }

  const messages = document.getElementById("messages");
  const input = document.getElementById("messageInput");
  const button = document.getElementById("sendButton");
  const typing = document.getElementById("typing");

  function addMessage(text, type) {
    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();

    if (!text) {
      return;
    }

    addMessage(text, "user");

    input.value = "";
    button.disabled = true;
    typing.style.display = "block";

    try {
      const response = await fetch("/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          user_id: userId,
          message: text
        })
      });

      if (!response.ok) {
        throw new Error(
          "Server returned status " + response.status
        );
      }

      const data = await response.json();

      addMessage(
        data.reply || "No response received.",
        "bot"
      );

    } catch (error) {
      console.error(error);

      addMessage(
        "Unable to connect to MindCare right now.",
        "bot"
      );
    }

    typing.style.display = "none";
    button.disabled = false;

    input.focus();
  }

  button.addEventListener("click", sendMessage);

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
