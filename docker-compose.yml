services:

  mindcare-api:
    build:
      context: ./app
    container_name: mindcare-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chromadb:/app/chromadb
      - ./data:/app/data
      - ./secrets/google-service-account.json:/app/secrets/google-service-account.json:ro

  n8n:
    image: n8nio/n8n:2.33.7
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.aiforge.tech
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_EDITOR_BASE_URL=https://n8n.aiforge.tech/
      - N8N_WEBHOOK_URL=https://n8n.aiforge.tech/
      - N8N_SECURE_COOKIE=true
      - GENERIC_TIMEZONE=Asia/Karachi
    volumes:
      - ./n8n_data:/home/node/.n8n

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
